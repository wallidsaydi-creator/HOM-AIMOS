name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan committed history and release tree
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  source:
    name: Source gates (Node ${{ matrix.node }})
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]

    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Fetch and verify canonical benchmark fixtures
        run: |
          bash eval/data/download.sh
          node eval/prepare-canonical-corpus.mjs

      - name: Run fail-closed source release gates
        run: npm run test:release:source

      - name: Verify package and runtime SBOM
        run: npm run test:release:artifact
